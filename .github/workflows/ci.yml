name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet: [ '8.0.x', '10.0.x' ]
    name: Run unit tests for Dotnet ${{ matrix.dotnet }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        id: stepid
        with:
          dotnet-version: ${{ matrix.dotnet }}
      - name: Build project
        run: dotnet build TinyCsvParser
      - name: Run unit tests
        working-directory: ./TinyCsvParser/TinyCsvParser.Test
        run: dotnet test --no-build --no-restore --verbosity normal
